<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Auto Skip</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" class="logo-icon">
                    <path
                        d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z" />
                </svg>
                <span class="logo-text">Auto Skip</span>
            </div>
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot"></span>
                <span class="status-text">Active</span>
            </div>
        </div>

        <!-- Main Toggle -->
        <div class="toggle-section">
            <div class="toggle-info">
                <h2>Auto Skip</h2>
                <p>Skip ads & dismiss popups automatically</p>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" id="enableToggle" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-icon ads-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
                    </svg>
                </div>
                <div class="stat-content">
                    <span class="stat-value" id="adsSkipped">0</span>
                    <span class="stat-label">Ads Skipped</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon popup-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
                    </svg>
                </div>
                <div class="stat-content">
                    <span class="stat-value" id="popupsDismissed">0</span>
                    <span class="stat-label">Popups Dismissed</span>
                </div>
            </div>
        </div>

        <!-- Features List -->
        <div class="features-section">
            <h3>Features</h3>
            <ul class="features-list">
                <li>
                    <svg class="feature-check" viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                    </svg>
                    <span>Auto-skip video ads</span>
                </li>
                <li>
                    <svg class="feature-check" viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                    </svg>
                    <span>Dismiss "Still watching?" popups</span>
                </li>
                <li>
                    <svg class="feature-check" viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                    </svg>
                    <span>Close overlay ads</span>
                </li>
            </ul>
        </div>

        <!-- Footer -->
        <div class="footer">
            <button class="reset-btn" id="resetStats">Reset Stats</button>
            <span class="version">v1.0.0</span>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
